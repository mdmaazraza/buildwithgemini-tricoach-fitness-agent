name: TriCoach Automated Testing & CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  lint-and-syntax:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check app/ tests/

  unit-and-api-tests:
    name: 🧪 Unit & API Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv pytest pytest-cov httpx

      - name: Run Unit Tests (Calories, Zones, Validation)
        run: |
          python -m pytest tests/unit/ -v --cov=app --cov-report=term-missing

      - name: Run API Tests (Chatbot, Calories, Workouts)
        run: |
          python -m pytest tests/api/ -v

      - name: Run Frontend Contract Tests
        run: |
          python -m pytest tests/frontend/ -v

  integration-tests:
    name: 🔄 Database & System Integration
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv pytest pytest-cov httpx

      - name: Run Integration Tests
        run: |
          python -m pytest tests/integration/ -v

  regression-tests:
    name: 🛡️ Regression Test Suite
    runs-on: ubuntu-latest
    needs: [unit-and-api-tests, integration-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv pytest pytest-asyncio httpx

      - name: Run Regression Suite
        run: |
          python -m pytest tests/regression/ -v -m regression

  e2e-playwright-tests:
    name: 🎭 Playwright E2E Browser Testing
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv pytest pytest-asyncio httpx playwright
          playwright install --with-deps chromium

      - name: Run E2E Playwright Suite
        run: |
          python -m pytest tests/e2e/ -v -m e2e

  quality-gate:
    name: 🚦 Quality Gate (Mandatory Deployment Blocker)
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, unit-and-api-tests, integration-tests, regression-tests, e2e-playwright-tests]
    if: always()
    steps:
      - name: Evaluate Test Results
        run: |
          if [ "${{ needs.lint-and-syntax.result }}" != "success" ] || \
             [ "${{ needs.unit-and-api-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.regression-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-playwright-tests.result }}" != "success" ]; then
            echo "❌ CRITICAL: One or more test suites or quality checks failed. Deployment is BLOCKED."
            exit 1
          fi
          echo "✅ All linting, unit, API, frontend, integration, regression, and E2E tests PASSED. Quality gate cleared!"

  deploy:
    name: 🚀 Production Auto-Deploy
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Web Host (Render / Cloud Run)
        run: |
          echo "🚀 Deploying verified release to production web host..."
          # If using Render deploy hook:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "🎉 Successfully triggered production deployment!"
